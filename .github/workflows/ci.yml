name: Verify and publish
on:
  push:
    branches: [main, feat/playable-slalom]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Encode recorded SL gameplay as MP4
        if: always()
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg unavailable; WebM captures remain in the artifact"
            exit 0
          fi
          find test-results -type f -name 'slalom-sl-*.webm' -print0 | while IFS= read -r -d '' clip; do
            mp4="${clip%.webm}.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "$clip" -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p -movflags +faststart "$mp4"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slalom-sl-videos
          path: |
            test-results/**/slalom-sl-*.webm
            test-results/**/slalom-sl-*.mp4
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
