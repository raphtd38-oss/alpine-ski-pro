name: Build isolated playable test (no GitHub Pages deployment)

on:
  push:
    branches:
      - feature/worldcup-start-human-tv-20261122
  workflow_dispatch:

# The production Github Pages release workflow is NEVER invoked here.
permissions:
  contents: write

concurrency:
  group: alpine-human-tv-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare licensed alpine textures and model pack
        run: npm run assets:alpine
      - name: Verify provenance of required environment resources
        run: npm run assets:audit -- --require-pack
      - name: Compile playable, static test
        run: npm run build
      - name: Install Chromium for focused start-camera smoke tests
        run: npx playwright install --with-deps chromium
      - name: Validate playable start scene and coach/athlete framing
        run: npx playwright test tests/browser/worldcup-start-tv.spec.ts tests/browser/worldcup-start-mobile.spec.ts --workers=1
      - name: Preserve exact World Cup TV screenshots for review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-start-evidence
          path: test-results/worldcup-start-*.png
      - name: Archive preview HTML/assets for independent download
        uses: actions/upload-artifact@v4
        with:
          name: alpine-ski-pro-playable-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Write preview to an isolated branch (NOT GitHub Pages)
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alpine-human-tv-static"
          cp -a dist/. "$RUNNER_TEMP/alpine-human-tv-static/"
          cd "$GITHUB_WORKSPACE"
          git config user.name "alpine-ski-preview[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan preview-worldcup-human-tv
          git rm -rf . || true
          git clean -fdx
          cp -a "$RUNNER_TEMP/alpine-human-tv-static/." .
          touch .nojekyll
          printf '%s\n' "Test only from feature/worldcup-start-human-tv-20261122" "Source commit: $RELEASE_SHA" "DO NOT deploy to GitHub Pages or merge this binary branch into main." > PREVIEW_INFO.txt
          git add -A
          git commit -m "test: static playable World Cup human TV preview from $RELEASE_SHA"
          git push --force origin HEAD:refs/heads/preview-worldcup-human-tv

      - name: Check that the independent playable URL and JS really load
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githack.com/raphtd38-oss/alpine-ski-pro/preview-worldcup-human-tv"
          for try in 1 2 3 4 5; do
            if curl -fL --connect-timeout 10 --max-time 35 -sS "$BASE/index.html" -o "$RUNNER_TEMP/test-preview.html"; then
              if grep -q '<canvas id="game"' "$RUNNER_TEMP/test-preview.html"; then
                break
              fi
            fi
            if [ "$try" = "5" ]; then
              echo "Preview HTML was not accessible as the real game" >&2
              exit 1
            fi
            sleep 8
          done
          SCRIPT="$(sed -n 's@.*src="./assets/\([^"]*\.js\)".*@\1@p' "$RUNNER_TEMP/test-preview.html" | head -1)"
          test -n "$SCRIPT"
          curl -fL --connect-timeout 10 --max-time 50 -sS "$BASE/assets/$SCRIPT" -o "$RUNNER_TEMP/test-preview.js"
          test "$(wc -c < "$RUNNER_TEMP/test-preview.js")" -gt 100000
          curl -fL --connect-timeout 10 --max-time 80 -sS "$BASE/assets/start/coach-ethan.glb" -o "$RUNNER_TEMP/test-coach.glb"
          test "$(wc -c < "$RUNNER_TEMP/test-coach.glb")" -gt 10000000
          echo "Verified real HTML, JS and 13 MB human GLB from: $BASE/index.html"
